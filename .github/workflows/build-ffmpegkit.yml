name: Build custom FFmpegKit AAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEGKIT_TAG: v8.1.9-lts-android
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install FFmpegKit host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            git \
            doxygen \
            nasm \
            cmake \
            gcc \
            g++ \
            gperf \
            texinfo \
            yasm \
            bison \
            autogen \
            wget \
            autopoint \
            meson \
            ninja-build \
            ragel \
            groff \
            gtk-doc-tools \
            make \
            unzip \
            python3 \
            perl

      - name: Verify build toolchain
        run: |
          set -eux

          echo "=== Host tools ==="
          command -v autoconf
          command -v automake
          command -v libtoolize || true
          command -v libtool || true
          command -v pkg-config
          command -v make
          command -v gcc
          command -v g++
          command -v clang
          command -v groff
          command -v autopoint

          echo "=== Tool versions ==="
          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1
          pkg-config --version
          gcc --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1

          echo "=== Check libtool package ==="
          dpkg -l libtool || true
          dpkg -L libtool || true

          echo "=== Android SDK/NDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"

          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          cat "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

      - name: Clone pinned FFmpegKit source
        run: |
          git clone --depth 1 --branch "${FFMPEGKIT_TAG}" \
            https://github.com/ffmpegkit-maintained/ffmpeg.git ffmpegkit

      - name: Patch GnuTLS configure for modern Clang
        run: |
          set -eux

          GNUTLS_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/gnutls.sh"
          test -f "$GNUTLS_SCRIPT"

          python3 - "$GNUTLS_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = '''if [[ ! -f "${BASEDIR}"/src/"${LIB_NAME}"/configure ]] || [[ ${RECONF_gnutls} -eq 1 ]]; then
            ./bootstrap --skip-po || return 1
            git submodule update --remote gnulib || return 1
            overwrite_file ./gnulib/lib/fpending.c ./src/gl/fpending.c || return 1
          fi
          '''

          if "PATCH_GNUTLS_MALFORMED_SIZEOF" in text:
              print("GnuTLS patch already installed")
              sys.exit(0)

          if marker not in text:
              print("ERROR: GnuTLS bootstrap marker not found")
              sys.exit(1)

          patch = marker + r'''
          # PATCH_GNUTLS_MALFORMED_SIZEOF
          # Old Autoconf/Gnulib generates invalid C:
          #
          #     sizeof ((pid_t))
          #
          # Modern Clang rejects this with:
          #
          #     error: expected expression
          #
          # Normalize:
          #
          #     sizeof ((TYPE))
          #
          # to:
          #
          #     sizeof (TYPE)

          GNUTLS_CONFIGURE="${BASEDIR}/src/${LIB_NAME}/configure"

          if [[ ! -f "${GNUTLS_CONFIGURE}" ]]; then
            echo "ERROR: GnuTLS configure was not generated: ${GNUTLS_CONFIGURE}"
            return 1
          fi

          python3 - "${GNUTLS_CONFIGURE}" <<'PYFIX'
          from pathlib import Path
          import re
          import sys

          cfg = Path(sys.argv[1])
          data = cfg.read_text()

          pattern = re.compile(
              r'(\bsizeof\s*\(\s*)\(([^()\n]+)\)(\s*\))'
          )

          fixed, count = pattern.subn(
              r'\1\2\3',
              data
          )

          cfg.write_text(fixed)

          print(f"GnuTLS malformed sizeof fixes: {count}")

          remaining = re.findall(
              r'\bsizeof\s*\(\s*\([^()\n]+\)\s*\)',
              fixed
          )

          if remaining:
              print("ERROR: malformed sizeof ((TYPE)) still remains")
              for item in remaining[:20]:
                  print(item)
              sys.exit(1)

          print("GnuTLS configure sizeof() validation: OK")
          PYFIX

          echo "=== Remaining malformed sizeof probes ==="
          if grep -nE 'sizeof[[:space:]]*\([[:space:]]*\(' \
              "${GNUTLS_CONFIGURE}" | head -50; then
            echo "ERROR: malformed sizeof probe remains"
            return 1
          fi

          echo "No malformed sizeof ((TYPE)) probes remain."
          '''

          path.write_text(text.replace(marker, patch))
          print("GnuTLS generic configure patch installed")
          PY

          grep -n "PATCH_GNUTLS_MALFORMED_SIZEOF" "$GNUTLS_SCRIPT"

      - name: Add OpenCL headers
        if: ${{ hashFiles('patches/ffmpeg-opencl-runtime.patch') != '' }}
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-headers
          mkdir -p ffmpegkit/third_party/opencl
          cp -R opencl-headers/CL ffmpegkit/third_party/opencl/include/

      - name: Inspect FFmpegKit source tree
        run: |
          set -eux
          echo "=== ffmpegkit root ==="
          pwd
          ls -la ffmpegkit

          echo "=== android-8.1-lts ==="
          find ffmpegkit/android-8.1-lts -maxdepth 3 -type f | head -100

          echo "=== configure files ==="
          find ffmpegkit -type f -name configure -print

          echo "=== FFmpeg source directories ==="
          find ffmpegkit -type d \( -name libavutil -o -name libavfilter \) -print

#      - name: Apply OpenCL runtime patch
#        run: |
#          set -euo pipefail
#
#          cd ffmpegkit
#
#          echo "Checking FFmpegKit source layout..."
#          test -f configure
#          test -f libavfilter/opencl.c
#          test -f libavfilter/opencl.h
#          test -f libavutil/hwcontext_opencl.c
#          test -f libavutil/Makefile
#
#          echo "FFmpeg source layout: OK"
#
#          git apply "../patches/ffmpeg-opencl-runtime.patch"

      - name: Build arm64-v8a FFmpegKit AAR
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          FFMPEGKIT_OPENCL: '1'
        run: |
          cd ffmpegkit/android-8.1-lts
          chmod +x android.sh
          ./android.sh \
            --lts \
            --full \
            --enable-gpl \
            --enable-android-media-codec \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64 \
            --no-output-redirection

      - name: Locate custom AAR
        run: |
          set -eux
          AAR="$(find ffmpegkit/android-8.1-lts/prebuilt -type f -name 'ffmpeg-kit.aar' | head -n 1)"
          test -n "$AAR"
          mkdir -p app/libs
          cp "$AAR" app/libs/ffmpeg-kit.aar
          echo "AAR=$AAR"

      - name: Verify AAR OpenCL/MediaCodec libraries and 16 KB alignment
        run: |
          set -euo pipefail
          rm -rf /tmp/aar-check
          mkdir -p /tmp/aar-check
          unzip -q app/libs/ffmpeg-kit.aar 'jni/*' -d /tmp/aar-check
          test -d /tmp/aar-check/jni/arm64-v8a

          found=0
          while IFS= read -r so; do
            found=1
            echo "Checking $so"
            aligns="$(readelf -lW "$so" | awk '$1=="LOAD" {print $NF}')"
            test -n "$aligns"
            while IFS= read -r align; do
              case "$align" in
                0x4000|0x8000|0x10000|0x20000|0x40000|0x80000|0x100000) ;;
                *) echo "ERROR: $so has LOAD alignment $align (< 16 KB)"; exit 1 ;;
              esac
            done <<< "$aligns"
          done < <(find /tmp/aar-check/jni/arm64-v8a -name '*.so' -type f)
          test "$found" -eq 1

          echo "16 KB ELF alignment check: PASS"

      - name: Build Android app against custom AAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload custom AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-custom-aar
          path: app/libs/ffmpeg-kit.aar
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload FFmpegKit build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-build-log
          path: |
            ffmpegkit/android-8.1-lts/build.log
            ffmpegkit/android-8.1-lts/**/*.log
          if-no-files-found: ignore
