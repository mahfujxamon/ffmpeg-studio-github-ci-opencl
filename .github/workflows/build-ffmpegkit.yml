name: Build custom FFmpegKit AAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEGKIT_TAG: v8.1.9-lts-android
  ANDROID_NDK_VERSION: 27.2.12479018

  # Khronos official OpenCL repositories
  OPENCL_HEADERS_TAG: v2026.05.29
  OPENCL_LOADER_TAG: v2026.05.29


jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout app
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'


      # ============================================================
      # 4. ANDROID SDK + NDK
      # ============================================================
      - name: Install Android SDK/NDK
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"


      # ============================================================
      # 5. HOST BUILD DEPENDENCIES
      # ============================================================
      - name: Install FFmpegKit host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            git \
            doxygen \
            nasm \
            cmake \
            gcc \
            g++ \
            gperf \
            texinfo \
            yasm \
            bison \
            autogen \
            wget \
            autopoint \
            meson \
            ninja-build \
            ragel \
            groff \
            gtk-doc-tools \
            libtasn1-bin \
            libtasn1-6-dev \
            make \
            unzip \
            python3 \
            perl


      # ============================================================
      # 6. VERIFY ASN.1
      # ============================================================
      - name: Verify GnuTLS ASN.1 tools
        run: |
          set -eux

          echo "=== ASN.1 parser ==="

          command -v asn1Parser

          asn1Parser --help >/dev/null 2>&1 || true

          echo "=== libtasn1 packages ==="

          dpkg -l | grep -E 'libtasn1-(bin|6-dev)' || true

          echo "=== asn1Parser location ==="

          ls -l "$(command -v asn1Parser)"


      # ============================================================
      # 7. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify build toolchain
        run: |
          set -eux

          echo "=== Host tools ==="

          command -v autoconf
          command -v automake
          command -v libtoolize
          command -v pkg-config
          command -v make
          command -v gcc
          command -v g++
          command -v clang
          command -v groff
          command -v autopoint
          command -v cmake

          echo "=== Tool versions ==="

          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1
          pkg-config --version
          gcc --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1
          cmake --version | head -n 1

          echo "=== Android SDK/NDK ==="

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"

          test -d \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -f \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          cat \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"


      # ============================================================
      # 8. CLONE FFMPEGKIT
      # ============================================================
      - name: Clone pinned FFmpegKit source
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "${FFMPEGKIT_TAG}" \
            https://github.com/ffmpegkit-maintained/ffmpeg.git \
            ffmpegkit

          test -d ffmpegkit/android-8.1-lts

          echo "FFmpegKit source:"
          git -C ffmpegkit rev-parse HEAD


      # ============================================================
      # 9. BUILD OFFICIAL KRHONOS OPENCL HEADERS + ICD LOADER
      # ============================================================
      - name: Build Khronos OpenCL ICD Loader
        run: |
          set -euxo pipefail

          rm -rf opencl-headers
          rm -rf icd-loader

          echo "=== Clone OpenCL-Headers ==="

          git clone \
            --depth 1 \
            --branch "${OPENCL_HEADERS_TAG}" \
            https://github.com/KhronosGroup/OpenCL-Headers.git \
            opencl-headers

          echo "=== Clone OpenCL-ICD-Loader ==="

          git clone \
            --depth 1 \
            --branch "${OPENCL_LOADER_TAG}" \
            https://github.com/KhronosGroup/OpenCL-ICD-Loader.git \
            icd-loader

          test -f \
            opencl-headers/CL/cl.h

          test -f \
            icd-loader/CMakeLists.txt

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          rm -rf icd-loader/build

          mkdir -p icd-loader/build

          echo "=== Configure Khronos ICD Loader ==="

          cmake \
            -S icd-loader \
            -B icd-loader/build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENCL_ICD_LOADER_BUILD_SHARED_LIBS=OFF \
            -DOPENCL_ICD_LOADER_PIC=ON \
            -DENABLE_OPENCL_LAYERS=OFF \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="${GITHUB_WORKSPACE}/opencl-headers"

          echo "=== Build Khronos static loader ==="

          cmake \
            --build icd-loader/build \
            --config Release \
            --target OpenCL \
            -j"$(nproc)"

          echo "=== OpenCL loader artifacts ==="

          LOADER_A="$(
            find icd-loader/build \
              -type f \
              -name 'libOpenCL.a' \
              | head -n 1
          )"

          test -n "$LOADER_A"
          test -f "$LOADER_A"

          echo "=== Final static loader ==="
          file "$LOADER_A"
          ls -lh "$LOADER_A"

          echo "OPENCL_LOADER_A=$LOADER_A" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VERIFY OPENCL LOADER SYMBOLS + ANDROID LINK
      # ============================================================
      - name: Verify OpenCL static loader
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x \
            "${NDK_BIN}/aarch64-linux-android21-clang"

          echo "=== Archive members ==="

          ar t \
            icd-loader/build/libOpenCL.a \
            | head -50

          echo "=== OpenCL exported definitions ==="

          nm -g --defined-only \
            icd-loader/build/libOpenCL.a \
            | grep -E \
              'clGetPlatformIDs|clGetPlatformInfo|clGetDeviceIDs' \
            | head -50

          echo "=== Static loader smoke source ==="

          cat > /tmp/opencl_smoke.c <<'EOF'
          #include <CL/cl.h>

          int main(void) {
              cl_uint count = 0;
              return (clGetPlatformIDs(0, NULL, &count) == CL_SUCCESS) ? 0 : 1;
          }
          EOF

          echo "=== Static loader smoke link ==="

          "${NDK_BIN}/aarch64-linux-android21-clang" \
            -I"${GITHUB_WORKSPACE}/opencl-headers" \
            /tmp/opencl_smoke.c \
            -L"${GITHUB_WORKSPACE}/icd-loader/build" \
            -Wl,--no-undefined \
            -lOpenCL \
            -ldl \
            -o /tmp/opencl_smoke

          file /tmp/opencl_smoke

          readelf -lW /tmp/opencl_smoke \
            | awk '$1=="LOAD" {print}'

          echo "OpenCL static loader smoke link: PASS"


      # ============================================================
      # 11. PREPARE OPENCL HEADER COMPATIBILITY
      # ============================================================
      - name: Prepare OpenCL headers
        run: |
          set -euxo pipefail

          test -f \
            opencl-headers/CL/cl.h

          rm -rf \
            opencl-headers/OpenCL

          ln -s \
            CL \
            opencl-headers/OpenCL

          test -f \
            opencl-headers/OpenCL/cl.h

          echo "=== OpenCL header paths ==="

          ls -l \
            opencl-headers/CL/cl.h

          ls -l \
            opencl-headers/OpenCL/cl.h


      # ============================================================
      # 12. ENABLE OPENCL + DISABLE OPENSSL
      # ============================================================
      - name: Configure FFmpeg OpenCL and disable OpenSSL
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"

          test -f "$FFMPEG_SCRIPT"
          test -f "$WORKSPACE_DIR/opencl-headers/CL/cl.h"
          test -f "$WORKSPACE_DIR/icd-loader/build/libOpenCL.a"

          python3 - "$FFMPEG_SCRIPT" "$WORKSPACE_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          workspace = sys.argv[2]

          text = path.read_text()

          OPENCL_BEGIN = "# FFMPEGKIT_KHRONOS_OPENCL_BEGIN"
          OPENCL_END   = "# FFMPEGKIT_KHRONOS_OPENCL_END"

          # --------------------------------------------------------
          # Remove previous injected Khronos OpenCL block
          # --------------------------------------------------------
          pattern = re.compile(
              rf"(?ms)^"
              rf"{re.escape(OPENCL_BEGIN)}.*?"
              rf"^{re.escape(OPENCL_END)}\n?"
          )

          text = pattern.sub("", text)

          # --------------------------------------------------------
          # Remove FFmpegKit internal OpenSSL enable line
          # --------------------------------------------------------
          lines = text.splitlines()

          cleaned = []

          for line in lines:
              if 'CONFIGURE_POSTFIX+=" --enable-openssl"' in line:
                  continue

              cleaned.append(line)

          text = "\n".join(cleaned) + "\n"

          # --------------------------------------------------------
          # GnuTLS must remain enabled
          # --------------------------------------------------------
          gnutls_line = 'CONFIGURE_POSTFIX+=" --enable-gnutls"'

          if gnutls_line not in text:
              raise SystemExit(
                  "ERROR: GnuTLS CONFIGURE_POSTFIX line not found"
              )

          # --------------------------------------------------------
          # Official Khronos OpenCL configuration
          # --------------------------------------------------------
          opencl_include = (
              f'CONFIGURE_POSTFIX+=" '
              f'--enable-opencl '
              f'--extra-cflags=-I{workspace}/opencl-headers"'
          )

          opencl_ldflags = (
              f'CONFIGURE_POSTFIX+=" '
              f'--extra-ldflags=-L{workspace}/icd-loader/build"'
          )

          opencl_dl = (
              'CONFIGURE_POSTFIX+=" '
              '--extra-ldflags=-ldl"'
          )

          opencl_block = f"""
          {OPENCL_BEGIN}

          # Official Khronos OpenCL-Headers
          {opencl_include}

          # Official Khronos static ICD Loader
          {opencl_ldflags}

          # Android dynamic linker required by ICD Loader
          {opencl_dl}

          {OPENCL_END}
          """

          # --------------------------------------------------------
          # Insert immediately after GnuTLS
          # --------------------------------------------------------
          insert_at = text.find(gnutls_line)

          if insert_at < 0:
              raise SystemExit(
                  "ERROR: Could not locate GnuTLS configuration line"
              )

          insert_at += len(gnutls_line)

          text = (
              text[:insert_at]
              + opencl_block
              + text[insert_at:]
          )

          path.write_text(text)

          print("========================================")
          print("OpenCL configuration installed")
          print("OpenSSL configuration disabled")
          print("========================================")
          PY

          echo
          echo "================================================"
          echo "===== FINAL FFMPEG OPENCL / SSL SETTINGS ======"
          echo "================================================"

          grep -nE \
            'enable-opencl|enable-openssl|enable-gnutls|extra-cflags|extra-ldflags|FFMPEGKIT_KHRONOS_OPENCL' \
            "$FFMPEG_SCRIPT" \
            || true


      # ============================================================
      # 13. VERIFY OPENCL + SSL CONFIGURATION
      # ============================================================
      - name: Verify FFmpeg OpenCL and SSL configuration
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"

          echo "=== OpenCL ==="

          grep -n \
            'CONFIGURE_POSTFIX+=" --enable-opencl' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'extra-cflags=-I' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'extra-ldflags=-L' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'extra-ldflags=-ldl' \
            "$FFMPEG_SCRIPT"

          echo
          echo "=== GnuTLS ==="

          grep -n \
            'enable-gnutls' \
            "$FFMPEG_SCRIPT"

          echo
          echo "=== OpenSSL ==="

          if grep -n \
            -- '--enable-openssl' \
            "$FFMPEG_SCRIPT"; then

            echo "ERROR: OpenSSL is still enabled"
            exit 1
          fi

          echo "OpenSSL enable flag: ABSENT"

          echo
          echo "=== Khronos files ==="

          test -f \
            "$WORKSPACE_DIR/opencl-headers/CL/cl.h"

          test -f \
            "$WORKSPACE_DIR/opencl-headers/OpenCL/cl.h"

          test -f \
            "$WORKSPACE_DIR/icd-loader/build/libOpenCL.a"

          echo
          echo "========================================"
          echo "OpenCL configuration: PASS"
          echo "GnuTLS configuration: PASS"
          echo "OpenSSL disabled: PASS"
          echo "========================================"


      # ============================================================
      # 14. PATCH GNUTLS FOR NDK 27.2
      # ============================================================
      - name: Patch GnuTLS for Android NDK 27.2
        run: |
          set -eux

          GNUTLS_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/gnutls.sh"

          test -f "$GNUTLS_SCRIPT"

          python3 - "$GNUTLS_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "PATCH_GNUTLS_ANDROID_CLANG_FLAGS"

          if marker in text:
              print(
                  "GnuTLS Android Clang patch already installed"
              )
              sys.exit(0)

          anchor = \
              'if [[ ! -f "${BASEDIR}"/src/"${LIB_NAME}"/configure ]]'

          if anchor not in text:
              print(
                  "ERROR: configure anchor not found"
              )
              sys.exit(1)

          patch = r'''
          # PATCH_GNUTLS_ANDROID_CLANG_FLAGS

          # Android NDK 27 Clang compatibility
          export CFLAGS="${CFLAGS:-} \
          -Wno-error=implicit-function-declaration \
          -Wno-error=incompatible-pointer-types \
          -Wno-error=int-conversion \
          -Wno-error=deprecated-non-prototype"
          '''

          text = text.replace(
              anchor,
              patch + anchor,
              1
          )

          path.write_text(text)

          print(
              "GnuTLS Android Clang compatibility patch installed"
          )
          PY

          grep -n \
            -B2 \
            -A5 \
            "PATCH_GNUTLS_ANDROID_CLANG_FLAGS" \
            "$GNUTLS_SCRIPT"


      # ============================================================
      # 15. FINAL PRE-BUILD SANITY CHECK
      # ============================================================
      - name: Final native build sanity check
        run: |
          set -euxo pipefail

          echo "=== NDK ==="

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -x \
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

          echo "=== Khronos OpenCL headers ==="

          test -f \
            "$GITHUB_WORKSPACE/opencl-headers/CL/cl.h"

          test -f \
            "$GITHUB_WORKSPACE/opencl-headers/OpenCL/cl.h"

          echo "=== Khronos static loader ==="

          test -f \
            "$GITHUB_WORKSPACE/icd-loader/build/libOpenCL.a"

          file \
            "$GITHUB_WORKSPACE/icd-loader/build/libOpenCL.a"

          echo "=== FFmpeg configure flags ==="

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"

          grep -nE \
            'enable-opencl|enable-gnutls|enable-openssl|extra-cflags|extra-ldflags' \
            "$FFMPEG_SCRIPT" \
            || true

          echo
          echo "========================================"
          echo "Native OpenCL build prerequisites: PASS"
          echo "========================================"


      # ============================================================
      # 16. BUILD FFMPEGKIT AAR
      # ============================================================
      - name: Build arm64-v8a FFmpegKit AAR
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}

        run: |
          cd ffmpegkit/android-8.1-lts

          chmod +x \
            android.sh

          set +e

          ./android.sh \
            --lts \
            --full \
            --enable-gpl \
            --enable-android-media-codec \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64 \
            --no-output-redirection

          BUILD_STATUS=$?

          echo
          echo "========================================"
          echo "===== BUILD FAILURE DIAGNOSTICS ========"
          echo "========================================"

          echo
          echo "===== GnuTLS files ====="

          find . \
            -type f \
            \( \
              -path '*gnutls*/configure' \
              -o \
              -path '*gnutls*/config.log' \
              -o \
              -path '*gnutls*/build.log' \
            \) \
            -print 2>/dev/null \
            | head -100 \
            || true

          echo
          echo "===== GnuTLS malformed sizeof ====="

          grep -R -n -E \
            'sizeof[[:space:]]*\([[:space:]]*\(' \
            src 2>/dev/null \
            | head -100 \
            || true

          echo
          echo "===== GnuTLS config.log errors ====="

          find . \
            -type f \
            -path '*gnutls*/config.log' \
            -print0 2>/dev/null |
            xargs -0 -r grep -n -E \
              'error:|ERROR:|failed|cannot|not found|undefined reference|expected expression' \
            | tail -200 \
            || true

          echo
          echo "===== FFmpeg configure errors ====="

          grep -n -i -E \
            'error:|ERROR:|failed|cannot|not found|undefined reference' \
            build.log 2>/dev/null \
            | tail -300 \
            || true

          echo
          echo "===== OpenCL references ====="

          grep -n -i \
            'opencl' \
            build.log 2>/dev/null \
            | tail -250 \
            || true

          echo
          echo "===== OpenSSL references ====="

          grep -n -i \
            'openssl' \
            build.log 2>/dev/null \
            | tail -250 \
            || true

          echo
          echo "===== GnuTLS references ====="

          grep -n -i \
            'gnutls' \
            build.log 2>/dev/null \
            | tail -250 \
            || true

          echo
          echo "===== MediaCodec references ====="

          grep -n -i \
            'mediacodec' \
            build.log 2>/dev/null \
            | tail -300 \
            || true

          echo
          echo "===== Last 400 build.log lines ====="

          tail -400 \
            build.log 2>/dev/null \
            || true

          exit $BUILD_STATUS


      # ============================================================
      # 17. LOCATE AAR
      # ============================================================
      - name: Locate custom AAR
        run: |
          set -eux

          AAR="$(
            find \
              ffmpegkit/android-8.1-lts/prebuilt \
              -type f \
              -name 'ffmpeg-kit.aar' \
              | head -n 1
          )"

          test -n "$AAR"
          test -f "$AAR"

          mkdir -p \
            app/libs

          cp \
            "$AAR" \
            app/libs/ffmpeg-kit.aar

          echo "AAR=$AAR"

          ls -lh \
            app/libs/ffmpeg-kit.aar


      # ============================================================
      # 18. VERIFY AAR CONTENTS
      # ============================================================
      - name: Verify AAR native libraries
        run: |
          set -euxo pipefail

          rm -rf \
            /tmp/aar-check

          mkdir -p \
            /tmp/aar-check

          unzip -q \
            app/libs/ffmpeg-kit.aar \
            'jni/*' \
            -d /tmp/aar-check

          test \
            -d /tmp/aar-check/jni/arm64-v8a

          echo "=== Native libraries ==="

          find \
            /tmp/aar-check/jni/arm64-v8a \
            -name '*.so' \
            -type f \
            -print

          SO_COUNT="$(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f \
              | wc -l
          )"

          test "$SO_COUNT" -gt 0

          echo
          echo "Native .so count: $SO_COUNT"


      # ============================================================
      # 19. VERIFY OPENCL SYMBOLS IN AAR
      # ============================================================
      - name: Verify OpenCL symbols inside native libraries
        run: |
          set -euxo pipefail

          OPENCL_FOUND=0

          while IFS= read -r so; do

            echo
            echo "Checking OpenCL symbols in:"
            echo "$so"

            if readelf -Ws "$so" 2>/dev/null |
              grep -E \
                '\bcl(GetPlatformIDs|GetPlatformInfo|GetDeviceIDs|CreateContext)\b' \
                >/dev/null; then

              echo "OpenCL loader symbols found in:"
              echo "$so"

              OPENCL_FOUND=1
            fi

          done < <(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f
          )

          test "$OPENCL_FOUND" -eq 1

          echo
          echo "========================================"
          echo "OpenCL native symbols: PASS"
          echo "========================================"


      # ============================================================
      # 20. VERIFY 16 KB ELF LOAD ALIGNMENT
      # ============================================================
      - name: Verify 16 KB ELF alignment
        run: |
          set -euo pipefail

          echo "=== Checking all arm64-v8a ELF LOAD segments ==="

          found=0

          while IFS= read -r so; do

            found=1

            echo
            echo "Checking:"
            echo "$so"

            aligns="$(
              readelf -lW "$so" |
              awk '$1=="LOAD" {print $NF}'
            )"

            test -n "$aligns"

            while IFS= read -r align; do

              # Bash supports hexadecimal arithmetic.
              align_value=$((align))

              echo \
                "LOAD alignment: $align ($align_value bytes)"

              if [ "$align_value" -lt 16384 ]; then

                echo
                echo "ERROR:"
                echo "$so has LOAD alignment $align"
                echo
                echo "Required minimum: 16384 bytes (16 KB)"

                exit 1
              fi

            done <<< "$aligns"

          done < <(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f
          )

          test "$found" -eq 1

          echo
          echo "========================================"
          echo "16 KB ELF alignment check: PASS"
          echo "========================================"


      # ============================================================
      # 21. CREATE DEBUG KEYSTORE
      # ============================================================
      - name: Create debug keystore
        run: |
          set -eux

          keytool \
            -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f \
            debug.keystore


      # ============================================================
      # 22. BUILD ANDROID APP
      # ============================================================
      - name: Build Android app against custom AAR
        run: |
          set -eux

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ============================================================
      # 23. UPLOAD AAR
      # ============================================================
      - name: Upload custom AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-custom-aar
          path: app/libs/ffmpeg-kit.aar
          if-no-files-found: error


      # ============================================================
      # 24. UPLOAD APK
      # ============================================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # 25. UPLOAD FFMPEGKIT BUILD LOG
      # ============================================================
      - name: Upload FFmpegKit build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-build-log
          path: |
            ffmpegkit/android-8.1-lts/build.log
            ffmpegkit/android-8.1-lts/**/*.log
          if-no-files-found: ignore
