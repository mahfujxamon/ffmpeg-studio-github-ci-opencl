name: Build custom FFmpegKit AAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEGKIT_TAG: v8.1.9-lts-android
  ANDROID_NDK_VERSION: 27.2.12479018

  # Khronos official repositories
  OPENCL_HEADERS_TAG: v2026.05.29
  OPENCL_LOADER_TAG: v2026.05.29

  # FFmpeg 8.x does not ship scale_opencl upstream. This pinned maintained
  # backport adds the filter and its OpenCL kernels.
  OPENCL_SCALE_PATCH_REF: 7fe3ec82a0c4f7ad0ed8c8f52359c2b579f3e28c
  OPENCL_SCALE_PATCH_BLOB_SHA1: ae6b34d9e0753a0c4c33ab8882cd01f25eff7526
  OPENCL_SCALE_PATCH_URL: https://raw.githubusercontent.com/SynoCommunity/spksrc/7fe3ec82a0c4f7ad0ed8c8f52359c2b579f3e28c/cross/ffmpeg8/patches/1006-jellyfin-0006-add-opencl-scaler-and-pixfmt-converter-impl.patch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Checkout application
      # ============================================================
      - name: Checkout app
        uses: actions/checkout@v4

      # The authoritative FFmpegKit binary is always built from the fresh pinned
      # source tree below. Do not let an uploaded/exposed AAR or stale JNI payload
      # influence the native build or the final APK.
      - name: Remove exposed/prebuilt FFmpeg artifacts
        run: |
          set -euxo pipefail
          rm -rf app/ffmpeg-kit-custom
          rm -rf app/libs


      # ============================================================
      # 2. Java
      # ============================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'


      # ============================================================
      # 4. Install Android SDK + exact NDK
      # ============================================================
      - name: Install Android SDK/NDK
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "=== Installed NDK ==="
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          cat \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"


      # ============================================================
      # 5. Host build dependencies
      # ============================================================
      - name: Install FFmpegKit host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            git \
            doxygen \
            nasm \
            cmake \
            gcc \
            g++ \
            gperf \
            texinfo \
            yasm \
            bison \
            autogen \
            wget \
            autopoint \
            meson \
            ninja-build \
            ragel \
            groff \
            gtk-doc-tools \
            libtasn1-bin \
            libtasn1-6-dev \
            make \
            unzip \
            python3 \
            perl


      # ============================================================
      # 6. Verify GnuTLS ASN.1 generator
      # ============================================================
      - name: Verify GnuTLS ASN.1 tools
        run: |
          set -eux

          echo "=== ASN.1 parser ==="
          command -v asn1Parser

          asn1Parser --help >/dev/null 2>&1 || true

          echo "=== libtasn1 packages ==="
          dpkg -l | grep -E 'libtasn1-(bin|6-dev)' || true

          echo "=== asn1Parser location ==="
          ls -l "$(command -v asn1Parser)"


      # ============================================================
      # 7. Verify complete host toolchain
      # ============================================================
      - name: Verify build toolchain
        run: |
          set -eux

          echo "========================================"
          echo "HOST TOOLS"
          echo "========================================"

          command -v autoconf
          command -v automake
          command -v libtoolize
          command -v pkg-config
          command -v make
          command -v gcc
          command -v g++
          command -v clang
          command -v groff
          command -v autopoint
          command -v cmake
          command -v git
          command -v python3
          command -v perl

          echo
          echo "========================================"
          echo "VERSIONS"
          echo "========================================"

          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1
          pkg-config --version
          gcc --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1
          cmake --version | head -n 1

          echo
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"

          test -d \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -f \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          cat \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"


      # ============================================================
      # 8. Clone exact FFmpegKit source
      # ============================================================
      - name: Clone pinned FFmpegKit source
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "${FFMPEGKIT_TAG}" \
            https://github.com/ffmpegkit-maintained/ffmpeg.git \
            ffmpegkit

          test -d ffmpegkit/android-8.1-lts

          echo "=== FFmpegKit revision ==="
          git -C ffmpegkit rev-parse HEAD

          echo "=== FFmpegKit tag ==="
          git -C ffmpegkit describe --tags --always


      # ============================================================
      # 8.5. Add maintained FFmpeg 8.x scale_opencl backport
      #
      # FFmpegKit v8.1.9 LTS follows FFmpeg 8.x, whose upstream filter set
      # contains the other OpenCL filters but does not contain scale_opencl.
      # Install the maintained FFmpeg 8.x backport as a normal FFmpegKit
      # patch so the native FFmpeg source build, not the Android app, owns
      # the filter implementation.
      # ============================================================
      - name: Add FFmpeg 8.x scale_opencl backport
        run: |
          set -euxo pipefail

          PATCH_DIR="${GITHUB_WORKSPACE}/ffmpegkit/android-8.1-lts/patches/ffmpeg"
          PATCH_FILE="${PATCH_DIR}/0006-add-opencl-scaler-and-pixfmt-converter-impl.patch"

          mkdir -p "$PATCH_DIR"

          curl -fsSL \
            "${OPENCL_SCALE_PATCH_URL}" \
            -o "$PATCH_FILE"

          test -s "$PATCH_FILE"

          echo "========================================"
          echo "OPENCL SCALE PATCH"
          echo "========================================"
          echo "Ref : ${OPENCL_SCALE_PATCH_REF}"
          echo "URL : ${OPENCL_SCALE_PATCH_URL}"
          echo "Git blob SHA-1 expected: ${OPENCL_SCALE_PATCH_BLOB_SHA1}"

          python3 - "$PATCH_FILE" "${OPENCL_SCALE_PATCH_BLOB_SHA1}" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          path = Path(sys.argv[1])
          expected = sys.argv[2]
          data = path.read_bytes()
          header = f"blob {len(data)}\0".encode()
          actual = hashlib.sha1(header + data).hexdigest()

          print(f"downloaded bytes : {len(data)}")
          print(f"git blob sha-1   : {actual}")

          if actual != expected:
              raise SystemExit(
                  f"ERROR: OpenCL scale patch integrity mismatch: {actual} != {expected}"
              )
          PY

          grep -F 'CONFIG_SCALE_OPENCL_FILTER' "$PATCH_FILE"
          grep -F 'vf_scale_opencl.c' "$PATCH_FILE"
          grep -F 'opencl/scale.cl' "$PATCH_FILE"

          echo
          echo "FFmpeg 8.x scale_opencl backport downloaded and integrity-verified."

          # The published patch targets an earlier FFmpeg 8.x Makefile. Apply
          # the deterministic n8.1.3 context adapter before FFmpegKit's normal
          # patch mechanism runs.
          chmod +x "${GITHUB_WORKSPACE}/scripts/adapt-opencl-scale-patch.py"

          python3 \
            "${GITHUB_WORKSPACE}/scripts/adapt-opencl-scale-patch.py" \
            "$PATCH_FILE"

          echo
          echo "========================================"
          echo "VERIFY ADAPTED PATCH"
          echo "========================================"

          grep -A7 -B1 -n \
            'OBJS-$(CONFIG_SCALE_OPENCL_FILTER)' \
            "$PATCH_FILE"



      # ============================================================
      # 9. Clone official Khronos OpenCL-Headers
      # ============================================================
      - name: Clone Khronos OpenCL Headers
        run: |
          set -eux

          rm -rf opencl-headers

          git clone \
            --depth 1 \
            --branch "${OPENCL_HEADERS_TAG}" \
            https://github.com/KhronosGroup/OpenCL-Headers.git \
            opencl-headers

          test -f opencl-headers/CL/cl.h

          echo "=== OpenCL-Headers revision ==="
          git -C opencl-headers rev-parse HEAD

          echo "=== OpenCL-Headers tag ==="
          git -C opencl-headers describe --tags --always


      # ============================================================
      # 10. Clone official Khronos OpenCL ICD Loader
      # ============================================================
      - name: Clone Khronos OpenCL ICD Loader
        run: |
          set -eux

          rm -rf icd-loader

          git clone \
            --depth 1 \
            --branch "${OPENCL_LOADER_TAG}" \
            https://github.com/KhronosGroup/OpenCL-ICD-Loader.git \
            icd-loader

          test -f icd-loader/CMakeLists.txt

          echo "=== OpenCL ICD Loader revision ==="
          git -C icd-loader rev-parse HEAD

          echo "=== OpenCL ICD Loader tag ==="
          git -C icd-loader describe --tags --always


      # ============================================================
      # 10.5. Patch Khronos loader for Android direct OpenCL providers
      # ============================================================
      - name: Patch Khronos loader for Android direct OpenCL providers
        run: |
          set -euxo pipefail
          chmod +x scripts/patch-khronos-loader-android-direct.py

          # Legacy Android OpenCL providers must NOT impersonate a Khronos ICD.
          # Patch the loader with a direct-provider bridge and hook all generated
          # OpenCL API entry points so calls reach the vendor library directly.
          python3 scripts/patch-khronos-loader-android-direct.py \
            icd-loader/loader/icd.c \
            icd-loader/loader/icd_dispatch_generated.c \
            icd-loader/loader/icd_dispatch.c

          grep -n \
            "ffmpegkit_direct_provider_active" \
            icd-loader/loader/icd.c

          grep -n \
            "FFMPEGKIT_DIRECT_LOADER_ENTRYPOINTS" \
            icd-loader/loader/icd_dispatch.c

          test "$(
            grep -c \
              "FFmpegKit Android direct-provider dispatch" \
              icd-loader/loader/icd_dispatch_generated.c
          )" -ge 100


      # ============================================================
      # 11. Build official Khronos ICD loader as STATIC PIC
      #
      # IMPORTANT:
      # libOpenCL.a is only the Khronos ICD loader.
      # It is NOT a GPU implementation.
      #
      # Runtime:
      #
      # FFmpeg
      #   -> Khronos ICD Loader
      #      -> actual installed OpenCL ICD
      #         -> GPU driver
      #
      # ============================================================
      - name: Build Khronos OpenCL ICD Loader
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -d "$ANDROID_NDK_HOME"

          rm -rf icd-loader/build

          mkdir -p icd-loader/build

          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          echo
          echo "========================================"
          echo "CONFIGURE KRHONOS ICD LOADER"
          echo "========================================"

          cmake \
            -S icd-loader \
            -B icd-loader/build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENCL_ICD_LOADER_BUILD_SHARED_LIBS=OFF \
            -DOPENCL_ICD_LOADER_PIC=ON \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="${GITHUB_WORKSPACE}/opencl-headers" \
            -DENABLE_OPENCL_LAYERS=OFF

          echo
          echo "========================================"
          echo "BUILD KRHONOS STATIC LOADER"
          echo "========================================"

          cmake \
            --build icd-loader/build \
            --config Release \
            --target OpenCL \
            -j"$(nproc)"

          echo
          echo "========================================"
          echo "SEARCH libOpenCL.a"
          echo "========================================"

          LOADER_A="$(
            find icd-loader/build \
              -type f \
              -name 'libOpenCL.a' \
              | head -n 1
          )"

          test -n "$LOADER_A"
          test -f "$LOADER_A"

          echo "Khronos loader:"
          echo "$LOADER_A"

          file "$LOADER_A"
          ls -lh "$LOADER_A"

          echo "OPENCL_LOADER_A=$LOADER_A" >> "$GITHUB_ENV"


      # ============================================================
      # 12. Verify static loader
      # ============================================================
      - name: Verify Khronos OpenCL static loader
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x \
            "${NDK_BIN}/aarch64-linux-android21-clang"

          test -f \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a"

          echo "========================================"
          echo "ARCHIVE MEMBERS"
          echo "========================================"

          ar t \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a" \
            | head -100

          echo
          echo "========================================"
          echo "OPENCL SYMBOLS"
          echo "========================================"

          nm -g --defined-only \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a" \
            | grep -E \
            'clGetPlatformIDs|clGetPlatformInfo|clGetDeviceIDs|clCreateContext' \
            | head -100

          echo
          echo "========================================"
          echo "DYNAMIC LOADER REFERENCES"
          echo "========================================"

          nm -u \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a" \
            | grep -E \
            'dlopen|dlsym|dlclose' \
            | head -100 || true


      # ============================================================
      # 13. Standalone static loader smoke-link
      # ============================================================
      - name: Smoke test Khronos OpenCL static loader
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="${NDK_BIN}/aarch64-linux-android21-clang"

          test -x "$CLANG"

          cat > /tmp/opencl_smoke.c <<'EOF'
          #include <CL/cl.h>

          int main(void)
          {
              cl_uint count = 0;

              return clGetPlatformIDs(
                  0,
                  NULL,
                  &count
              ) == CL_SUCCESS ? 0 : 1;
          }
          EOF

          echo "========================================"
          echo "STATIC LOADER SMOKE LINK"
          echo "========================================"

          "$CLANG" \
            -I"${GITHUB_WORKSPACE}/opencl-headers" \
            /tmp/opencl_smoke.c \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a" \
            -ldl \
            -o /tmp/opencl_smoke

          file /tmp/opencl_smoke

          echo
          echo "========================================"
          echo "SMOKE ELF LOAD ALIGNMENT"
          echo "========================================"

          readelf -lW /tmp/opencl_smoke \
            | awk '$1=="LOAD" {print}'

          echo
          echo "Khronos static loader smoke link: PASS"


      # ============================================================
      # 14. Make FFmpeg-compatible OpenCL/cl.h path
      #
      # FFmpeg checks OpenCL/cl.h.
      # Khronos-Headers normally provides CL/cl.h.
      # ============================================================
      - name: Prepare OpenCL headers for FFmpeg
        run: |
          set -euxo pipefail

          test -f opencl-headers/CL/cl.h

          rm -rf opencl-headers/OpenCL

          ln -s CL opencl-headers/OpenCL

          test -f opencl-headers/OpenCL/cl.h

          echo "========================================"
          echo "OPENCL HEADERS"
          echo "========================================"

          ls -l opencl-headers/CL/cl.h
          ls -l opencl-headers/OpenCL/cl.h


      # ============================================================
      # 15. Patch FFmpeg Android configure
      #
      # OpenCL uses the official Khronos headers + ICD loader. OpenSSL is kept
      # enabled; GnuTLS is disabled at the FFmpegKit library-selection layer.
      #
      - name: Enable Khronos OpenCL and use OpenSSL
        run: |
          set -euxo pipefail

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"
          OPENCL_HEADERS="${GITHUB_WORKSPACE}/opencl-headers"
          OPENCL_LOADER="${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a"
          OPENCL_LOADER_DIR="${GITHUB_WORKSPACE}/icd-loader/build"

          test -f "$FFMPEG_SCRIPT"
          test -f "$OPENCL_HEADERS/CL/cl.h"
          test -f "$OPENCL_LOADER"
          test -d "$OPENCL_LOADER_DIR"

          python3 - "$FFMPEG_SCRIPT" "$OPENCL_HEADERS" "$OPENCL_LOADER_DIR" <<'PYIN'
          from pathlib import Path
          import sys

          script = Path(sys.argv[1])
          headers = sys.argv[2]
          loader_dir = sys.argv[3]
          text = script.read_text()

          begin_marker = "# BEGIN FFMPEGKIT_KHRONOS_OPENCL"
          end_marker = "# END FFMPEGKIT_KHRONOS_OPENCL"
          if begin_marker in text and end_marker in text:
              start = text.index(begin_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]

          # Normalize any stale/generated SSL override back to OpenSSL.
          text = text.replace(
              'CONFIGURE_POSTFIX+=" --disable-openssl"',
              'CONFIGURE_POSTFIX+=" --enable-openssl"'
          )

          anchor = 'CONFIGURE_POSTFIX=""'
          if anchor not in text:
              raise SystemExit("ERROR: CONFIGURE_POSTFIX anchor not found")

          block = f'''# BEGIN FFMPEGKIT_KHRONOS_OPENCL
          CONFIGURE_POSTFIX+=" --enable-opencl"
          CONFIGURE_POSTFIX+=" --extra-cflags=-DCL_TARGET_OPENCL_VERSION=120"
          CONFIGURE_POSTFIX+=" --extra-cflags=-I{headers}"
          CONFIGURE_POSTFIX+=" --extra-ldflags=-L{loader_dir}"
          CONFIGURE_POSTFIX+=" --extra-libs=-ldl"
          # END FFMPEGKIT_KHRONOS_OPENCL
          '''
          text = text.replace(anchor, anchor + "\n" + block, 1)

          # Assert the exact intended SSL state in the resulting script.
          if '--enable-openssl' not in text:
              text += '\nCONFIGURE_POSTFIX+=" --enable-openssl"\n'
          if '--disable-openssl' in text:
              raise SystemExit("ERROR: --disable-openssl remains after normalization")

          script.write_text(text)
          print("PASS: OpenCL loader configuration installed")
          print("PASS: OpenSSL retained")
          print("PASS: GnuTLS will be disabled by android.sh library selection")
          PYIN

          ! grep -n -- '--disable-openssl' "$FFMPEG_SCRIPT"
          grep -n -- '--enable-openssl' "$FFMPEG_SCRIPT"
          grep -n -- '--enable-opencl' "$FFMPEG_SCRIPT"


      # 16. Patch FFmpegKit fftools hardware-device propagation
      #
      # FFmpeg 8.1's hwupload initializes early and requires
      # AVFilterContext.hw_device_ctx to be populated BEFORE the filter
      # graph is initialized. FFmpegKit's Android fftools copy in this
      # source tree still uses the older order: graph_parse() first,
      # hw_device_setup_for_filter() afterwards.
      #
      # That exact mismatch causes:
      #   A hardware device reference is required to upload frames to.
      #
      # Port the upstream FFmpeg fix into the FFmpegKit Android fftools
      # copy. This does not bundle or modify any vendor OpenCL library.
      # ============================================================
      - name: Patch FFmpegKit fftools hardware-device propagation
        run: |
          set -euxo pipefail

          CPP_DIR="${GITHUB_WORKSPACE}/ffmpegkit/android-8.1-lts/android/ffmpeg-kit-android-lib/src/main/cpp"
          FILTER_C="${CPP_DIR}/fftools_ffmpeg_filter.c"
          HW_C="${CPP_DIR}/fftools_ffmpeg_hw.c"
          HEADER="${CPP_DIR}/fftools_ffmpeg.h"

          test -f "$FILTER_C"
          test -f "$HW_C"
          test -f "$HEADER"

          python3 \
            "${GITHUB_WORKSPACE}/scripts/patch-ffmpegkit-hwdevice.py" \
            "$FILTER_C" "$HW_C" "$HEADER"

          echo "========================================"
          echo "VERIFY HWDEVICE PROPAGATION PATCH"
          echo "========================================"

          grep -nE \
            'FFMPEGKIT_HWDEVICE_BEFORE_FILTER_INIT_V9|hw_device_for_filter|graph_parse.*hw_device|f->hw_device_ctx|attached selected device' \
            "$FILTER_C" "$HW_C" "$HEADER"

          if grep -n 'hw_device_setup_for_filter' "$FILTER_C" "$HW_C" "$HEADER"; then
            echo "ERROR: legacy post-init hardware-device setup still present."
            exit 1
          fi

          echo
          echo "=== Patched graph_parse excerpt ==="
          sed -n '460,545p' "$FILTER_C"

          echo
          echo "=== Patched configure_filtergraph excerpt ==="
          sed -n '1185,1235p' "$FILTER_C"


      # ============================================================
      # 17. Verify FFmpeg configure patch
      # ============================================================
      - name: Verify FFmpeg OpenCL and SSL configuration
        run: |
          set -euxo pipefail

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"

          test -f "$FFMPEG_SCRIPT"

          echo "========================================"
          echo "OPENCL"
          echo "========================================"

          grep -n \
            'CONFIGURE_POSTFIX+=" --enable-opencl"' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'CL_TARGET_OPENCL_VERSION=120' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'CONFIGURE_POSTFIX+=" --extra-cflags=-I' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'CONFIGURE_POSTFIX+=" --extra-ldflags=-L' \
            "$FFMPEG_SCRIPT"

          grep -n \
            'CONFIGURE_POSTFIX+=" --extra-libs=-ldl"' \
            "$FFMPEG_SCRIPT"

          echo
          echo "========================================"
          echo "GNUTLS DISABLED / OPENSSL ENABLED"
          echo "========================================"

          grep -n -- '--enable-openssl' "$FFMPEG_SCRIPT"
          grep -n '^    gnutls)' "$FFMPEG_SCRIPT"
          ! grep -n -- '--disable-openssl' "$FFMPEG_SCRIPT"

          echo
          echo "========================================"
          echo "KRHONOS FILES"
          echo "========================================"

          test -f \
            "${GITHUB_WORKSPACE}/opencl-headers/CL/cl.h"

          test -f \
            "${GITHUB_WORKSPACE}/opencl-headers/OpenCL/cl.h"

          test -f \
            "${GITHUB_WORKSPACE}/icd-loader/build/libOpenCL.a"

          echo
          echo "========================================"
          echo "OPENCL CONFIGURATION: PASS"
          echo "========================================"


      # ============================================================
      # 17.5. Install n8.1.3 scale_opencl compatibility hook
      #
      # The FFmpegKit build downloads FFmpeg inside downloaded_library_sources().
      # Apply the scale_opencl source compatibility transform immediately after
      # the normal FFmpeg patch set, when vf_scale_opencl.c actually exists.
      #
      - name: Install n8.1.3 scale_opencl compatibility hook
        run: |
          set -euxo pipefail

          FUNCTION_SH="ffmpegkit/android-8.1-lts/scripts/function.sh"
          test -f "$FUNCTION_SH"
          test -f "scripts/compat-scale-opencl-n813.py"

          python3 - "$FUNCTION_SH" <<'PYIN'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          marker = "# FFMPEGKIT_N813_SCALE_OPENCL_HOOK"
          if marker in text:
              print("PASS: scale_opencl n8.1.3 hook already installed")
              raise SystemExit(0)

          anchor = '  apply_library_patches "ffmpeg"\n'
          if anchor not in text:
              raise SystemExit("ERROR: FFmpeg patch hook anchor not found")

          hook = (
              '  # FFMPEGKIT_N813_SCALE_OPENCL_HOOK\n'
              '  python3 "${BASEDIR}/../../scripts/compat-scale-opencl-n813.py" '
              '"${BASEDIR}/src/ffmpeg/libavfilter/vf_scale_opencl.c" || exit 1\n'
          )
          text = text.replace(anchor, anchor + hook, 1)
          path.write_text(text)
          print("PASS: scale_opencl n8.1.3 compatibility hook installed")
          PYIN

          grep -n -A4 -B1 \
            "FFMPEGKIT_N813_SCALE_OPENCL_HOOK" \
            "$FUNCTION_SH"


      # ============================================================
      # 18. Verify OpenSSL-only TLS selection
      # ============================================================
      - name: Verify OpenSSL-only TLS selection
        run: |
          set -euxo pipefail

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"
          test -f "$FFMPEG_SCRIPT"

          # GnuTLS is disabled as a library in the android.sh invocation.
          # The ffmpeg.sh case remains present but is never entered when the
          # gnutls library is disabled after --full.
          grep -n '^    gnutls)' "$FFMPEG_SCRIPT"
          grep -n -- '--enable-openssl' "$FFMPEG_SCRIPT"


      # 19. Final pre-build sanity check
      # ============================================================
      - name: Final native build sanity check
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -x \
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

          echo
          echo "========================================"
          echo "OPENCL HEADERS"
          echo "========================================"

          test -f \
            "$GITHUB_WORKSPACE/opencl-headers/CL/cl.h"

          test -f \
            "$GITHUB_WORKSPACE/opencl-headers/OpenCL/cl.h"

          echo
          echo "========================================"
          echo "STATIC OPENCL LOADER"
          echo "========================================"

          test -f \
            "$GITHUB_WORKSPACE/icd-loader/build/libOpenCL.a"

          file \
            "$GITHUB_WORKSPACE/icd-loader/build/libOpenCL.a"

          echo
          echo "========================================"
          echo "FFMPEG CONFIGURE FLAGS"
          echo "========================================"

          FFMPEG_SCRIPT="ffmpegkit/android-8.1-lts/scripts/android/ffmpeg.sh"

          grep -nE \
            'enable-opencl|enable-gnutls|enable-openssl|disable-openssl|extra-cflags|extra-libs' \
            "$FFMPEG_SCRIPT" \
            || true

          echo
          echo "========================================"
          echo "SCALE OPENCL PATCH ADAPTER"
          echo "========================================"

          test -f \
            "${GITHUB_WORKSPACE}/scripts/adapt-opencl-scale-patch.py"
          python3 -m py_compile \
            "${GITHUB_WORKSPACE}/scripts/adapt-opencl-scale-patch.py"
          python3 -m py_compile \
            "${GITHUB_WORKSPACE}/scripts/compat-scale-opencl-n813.py"

          grep -F "FFMPEGKIT_N813_SCALE_OPENCL_HOOK" \
            ffmpegkit/android-8.1-lts/scripts/function.sh

          ! grep -n -- '--disable-openssl' "$FFMPEG_SCRIPT"
          grep -n -- '--enable-openssl' "$FFMPEG_SCRIPT"
          grep -n '^    gnutls)' "$FFMPEG_SCRIPT"

          echo
          echo "========================================"
          echo "PRE-BUILD CHECK: PASS"
          echo "========================================"


      # ============================================================
      # 20. Build arm64-v8a FFmpegKit
      #
      # MediaCodec remains enabled.
      #
      # Architecture:
      # arm64-v8a only for this first build.
      # ============================================================
      - name: Build arm64-v8a FFmpegKit AAR
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}

        run: |
          cd ffmpegkit/android-8.1-lts

          chmod +x android.sh

          set +e

          ./android.sh \
            --lts \
            --full \
            --enable-gpl \
            --enable-android-media-codec \
            --enable-openssl \
            --disable-lib-gnutls \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64 \
            --no-output-redirection

          BUILD_STATUS=$?

          echo
          echo "========================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "========================================"

          echo
          echo "===== GnuTLS files ====="

          find . \
            -type f \
            \( \
              -path '*gnutls*/configure' \
              -o -path '*gnutls*/config.log' \
              -o -path '*gnutls*/build.log' \
            \) \
            -print \
            2>/dev/null \
            | head -100 \
            || true

          echo
          echo "===== GnuTLS configure errors ====="

          find . \
            -type f \
            -path '*gnutls*/config.log' \
            -print0 \
            2>/dev/null \
            | xargs -0 -r grep -n -E \
              'error:|ERROR:|failed|cannot|not found|undefined reference|expected expression' \
            | tail -250 \
            || true

          echo
          echo "===== FFmpeg config.log ====="

          find src \
            -type f \
            -path '*ffmpeg*/ffbuild/config.log' \
            -print \
            2>/dev/null \
            | head -20 \
            || true

          echo
          echo "===== FFmpeg configure errors ====="

          grep -n -i -E \
            'error:|ERROR:|failed|cannot|not found|undefined reference|C compiler test failed' \
            build.log \
            2>/dev/null \
            | tail -400 \
            || true

          echo
          echo "===== OpenCL references ====="

          grep -n -i \
            -E 'opencl|scale_opencl' \
            build.log \
            2>/dev/null \
            | tail -400 \
            || true

          echo
          echo "===== OpenSSL references ====="

          grep -n -i \
            'openssl' \
            build.log \
            2>/dev/null \
            | tail -300 \
            || true

          echo
          echo "===== GnuTLS references ====="

          grep -n -i \
            'gnutls' \
            build.log \
            2>/dev/null \
            | tail -300 \
            || true

          echo
          echo "===== MediaCodec references ====="

          grep -n -i \
            'mediacodec' \
            build.log \
            2>/dev/null \
            | tail -300 \
            || true

          echo
          echo "===== Last 500 build.log lines ====="

          tail -500 \
            build.log \
            2>/dev/null \
            || true

          exit "$BUILD_STATUS"


      # ============================================================
      # 19.5. Diagnose FFmpeg OpenCL linker test
      # ============================================================
      - name: Diagnose FFmpeg OpenCL linker test
        if: always()
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "SEARCHING OPENCL LINK TEST"
          echo "========================================"

          find \
            ffmpegkit/android-8.1-lts/src/ffmpeg \
            -type f \
            -path '*/ffbuild/config.log' \
            -print \
            2>/dev/null \
            | while read -r log; do
                echo
                echo "===== $log ====="

                grep -n -i -E \
                  'opencl|clEnqueueNDRangeKernel|OpenCL/cl.h|CL/cl.h|-lOpenCL|libOpenCL|extra-ldflags' \
                  "$log" \
                  | tail -250 \
                  || true
              done


      # ============================================================
      # 20. Locate generated AAR
      # ============================================================
      - name: Locate custom AAR
        run: |
          set -eux

          AAR="$(
            find \
              ffmpegkit/android-8.1-lts/prebuilt \
              -type f \
              -name 'ffmpeg-kit.aar' \
              | head -n 1
          )"

          test -n "$AAR"
          test -f "$AAR"

          mkdir -p app/libs

          cp \
            "$AAR" \
            app/libs/ffmpeg-kit.aar

          cp \
            "$AAR" \
            app/libs/ffmpeg-kit-custom.aar

          echo "AAR=$AAR"

          ls -lh \
            app/libs/ffmpeg-kit.aar \
            app/libs/ffmpeg-kit-custom.aar


      # ============================================================
      # 21. Extract AAR native libraries
      # ============================================================
      - name: Verify AAR native libraries
        run: |
          set -euxo pipefail

          rm -rf /tmp/aar-check

          mkdir -p /tmp/aar-check

          unzip -q \
            app/libs/ffmpeg-kit.aar \
            'jni/*' \
            -d /tmp/aar-check

          test \
            -d /tmp/aar-check/jni/arm64-v8a

          echo "========================================"
          echo "ARM64 NATIVE LIBRARIES"
          echo "========================================"

          find \
            /tmp/aar-check/jni/arm64-v8a \
            -name '*.so' \
            -type f \
            -print

          SO_COUNT="$(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f \
              | wc -l
          )"

          test "$SO_COUNT" -gt 0

          echo
          echo "Native .so count: $SO_COUNT"


      # ============================================================
      # 21.5. Verify required OpenCL filters in final libavfilter.so
      #
      # This is intentionally an artifact-level check. A successful native
      # compile is not enough: the final AAR must actually register the
      # filters the editor expects.
      # ============================================================
      - name: Verify final OpenCL filter inventory
        run: |
          set -euxo pipefail

          SO="/tmp/aar-check/jni/arm64-v8a/libavfilter.so"
          test -f "$SO"

          chmod +x scripts/verify-required-opencl-filters.sh
          scripts/verify-required-opencl-filters.sh "$SO"


      # ============================================================
      # 22. Diagnose actual OpenCL linkage
      #
      # IMPORTANT:
      # This step DOES NOT fail merely because the symbols are not
      # visible in one particular .so.
      #
      # It prints:
      #   - OpenCL symbols
      #   - undefined symbols
      #   - dependencies
      #
      # The actual build/link step above remains authoritative.
      # ============================================================
      - name: Diagnose OpenCL integration in AAR
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "OPENCL SYMBOL DIAGNOSTICS"
          echo "========================================"

          while IFS= read -r so; do

            echo
            echo "========================================"
            echo "$so"
            echo "========================================"

            echo
            echo "--- OpenCL defined/undefined symbols ---"

            readelf -Ws "$so" 2>/dev/null \
              | grep -E \
              'cl(GetPlatformIDs|GetPlatformInfo|GetDeviceIDs|CreateContext|ReleaseContext|GetDeviceInfo|CreateCommandQueue|GetExtensionFunctionAddressForPlatform)' \
              || true

            echo
            echo "--- Dynamic dependencies ---"

            readelf -d "$so" 2>/dev/null \
              | grep -E \
              'NEEDED|RPATH|RUNPATH' \
              || true

          done < <(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f
          )

          echo
          echo "========================================"
          echo "OpenCL diagnostic completed."
          echo "========================================"


      # ============================================================
      # 23. Verify 16 KB ELF LOAD alignment
      # ============================================================
      - name: Verify 16 KB ELF alignment
        run: |
          set -euo pipefail

          echo "========================================"
          echo "16 KB ELF ALIGNMENT"
          echo "========================================"

          found=0

          while IFS= read -r so; do

            found=1

            echo
            echo "Checking:"
            echo "$so"

            aligns="$(
              readelf -lW "$so" \
                | awk '$1=="LOAD" {print $NF}'
            )"

            test -n "$aligns"

            while IFS= read -r align; do

              align_value=$((align))

              echo \
                "LOAD alignment: $align (${align_value} bytes)"

              if [ "$align_value" -lt 16384 ]; then

                echo
                echo "ERROR:"
                echo "$so has LOAD alignment $align"

                echo \
                  "Required minimum: 16384 bytes (16 KB)"

                exit 1
              fi

            done <<< "$aligns"

          done < <(
            find \
              /tmp/aar-check/jni/arm64-v8a \
              -name '*.so' \
              -type f
          )

          test "$found" -eq 1

          echo
          echo "========================================"
          echo "16 KB ELF alignment: PASS"
          echo "========================================"


      # ============================================================
      # 24. Create debug keystore
      # ============================================================
      - name: Create debug keystore
        run: |
          set -eux

          keytool \
            -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f debug.keystore


      # ============================================================
      # App-side OpenCL command hardening guard
      # ============================================================
      - name: Verify app-side OpenCL command normalization
        run: |
          set -euxo pipefail

          ENGINE=app/src/main/java/com/example/data/engine/NativeFfmpegEngine.kt
          TESTS=app/src/test/java/com/example/ExampleRobolectricTest.kt

          test -f "$ENGINE"
          test -f "$TESTS"
          grep -F 'ensureOpenClHardwareDeviceOptions' "$ENGINE"
          grep -F -- '-init_hw_device opencl=ocl:0.0' "$ENGINE"
          grep -F -- '-filter_hw_device ocl' "$ENGINE"
          grep -F 'opencl commands automatically receive explicit hardware device options' "$TESTS"


      # ============================================================
      # 25. Build Android application against custom AAR
      # ============================================================
      - name: Build Android app against custom AAR
        run: |
          set -eux

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Run app unit tests
        run: |
          set -eux

          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest


      # ============================================================
      # 26. Verify local-AAR runtime dependency packaging
      #
      # A file-based AAR has no Maven POM, so smart-exception-java must
      # be a direct app dependency. This prevents the previous
      # NoClassDefFoundError from returning after a successful native build.
      # ============================================================
      - name: Verify Smart Exception runtime dependency
        run: |
          set -euxo pipefail

          gradle \
            --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            > /tmp/debug-runtime-classpath.txt

          grep -F \
            'com.arthenica:smart-exception-java:0.2.1' \
            /tmp/debug-runtime-classpath.txt

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"

          found=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" 2>/dev/null \
              | strings \
              | grep -Fq \
              'Lcom/arthenica/smartexception/java/Exceptions;'; then
              echo "Found Smart Exception class in $dex"
              found=1
              break
            fi
          done < <(unzip -Z1 "$APK" 'classes*.dex')

          test "$found" -eq 1


      # ============================================================
      # 27. Verify final APK ZIP/container integrity
      #
      # An Android APK is a ZIP container. A successful Gradle build
      # is not enough if the APK is corrupted after packaging or
      # during artifact handling. Verify the exact bytes BEFORE
      # uploading them.
      # ============================================================
      - name: Verify final APK integrity and signing
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "========================================"
          echo "APK FILE"
          echo "========================================"
          ls -lh "$APK"
          file "$APK"

          echo
          echo "========================================"
          echo "APK ZIP TEST"
          echo "========================================"
          unzip -t "$APK"

          echo
          echo "========================================"
          echo "APK ZIP LIST TEST"
          echo "========================================"
          unzip -Z1 "$APK" >/tmp/apk-file-list.txt
          test -s /tmp/apk-file-list.txt
          wc -l /tmp/apk-file-list.txt

          echo
          echo "========================================"
          echo "ZIP ALIGNMENT"
          echo "========================================"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          echo
          echo "========================================"
          echo "APK SIGNATURE"
          echo "========================================"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"
          sha256sum "$APK" | tee app-debug.apk.sha256

          mkdir -p dist
          cp "$APK" dist/ffmpeg-studio-debug.apk
          cp app-debug.apk.sha256 dist/ffmpeg-studio-debug.apk.sha256

          # Verify the COPIED artifact bytes again.
          sha256sum -c dist/ffmpeg-studio-debug.apk.sha256
          unzip -t dist/ffmpeg-studio-debug.apk

          echo
          echo "APK integrity: PASS"


      # ============================================================
      # 28. Upload AAR
      # ============================================================
      - name: Upload custom AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-custom-aar
          path: app/libs/ffmpeg-kit.aar
          if-no-files-found: error


      # ============================================================
      # 29. Upload APK
      #
      # Upload the exact verified copy, not a wildcard.
      # compression-level 0 avoids an unnecessary second compression
      # layer around the already-compressed APK during artifact
      # creation.
      # ============================================================
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-debug-apk
          path: |
            dist/ffmpeg-studio-debug.apk
            dist/ffmpeg-studio-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # 30. Upload FFmpegKit build logs
      # ============================================================
      - name: Upload FFmpegKit build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-build-log
          path: |
            ffmpegkit/android-8.1-lts/build.log
            ffmpegkit/android-8.1-lts/**/*.log
          if-no-files-found: ignore