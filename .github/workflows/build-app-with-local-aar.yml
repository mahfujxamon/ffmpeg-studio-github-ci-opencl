name: Build Android app with local custom FFmpegKit AAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK + exact NDK
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify local custom FFmpegKit AAR
        run: |
          set -eux
          test -s app/libs/ffmpeg-kit-custom.aar
          unzip -t app/libs/ffmpeg-kit-custom.aar
          echo "=== AAR contents ==="
          unzip -l app/libs/ffmpeg-kit-custom.aar

      - name: Build debug APK
        run: |
          set -eux
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK ZIP integrity
        run: |
          set -eux
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "${APK}"
          unzip -t "${APK}"
          echo "APK=${APK}"
          sha256sum "${APK}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
