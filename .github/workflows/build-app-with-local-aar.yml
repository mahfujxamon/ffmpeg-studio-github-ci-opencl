name: Build Android app with local custom FFmpegKit AAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK + exact NDK
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Package exploded custom FFmpegKit AAR
        run: |
          set -eux
          AAR_DIR="app/ffmpeg-kit-custom"
          AAR_OUT="app/libs/ffmpeg-kit-custom.aar"

          test -d "$AAR_DIR"
          rm -f "$AAR_OUT"

          # The repository stores the AAR EXPLODED. Re-create the AAR archive
          # with its contents at the archive root (not nested under a folder).
          test -f "$AAR_DIR/AndroidManifest.xml"
          test -f "$AAR_DIR/classes.jar"

          mkdir -p app/libs
          (
            cd "$AAR_DIR"
            zip -qr "../libs/ffmpeg-kit-custom.aar" . \
              -x 'PUT_UNZIPPED_AAR_CONTENTS_HERE.txt'
          )

          echo "=== Generated AAR ==="
          ls -lh "$AAR_OUT"
          unzip -t "$AAR_OUT"
          echo "=== AAR contents ==="
          unzip -l "$AAR_OUT"

      - name: Build debug APK
        run: |
          set -eux
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK ZIP integrity
        run: |
          set -eux
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "${APK}"
          unzip -t "${APK}"
          echo "APK=${APK}"
          sha256sum "${APK}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
